name: mobile
description: 'RPG game for mobile and web'
publish_to: 'none'
version: 1.0.0+1

environment:
    sdk: ^3.7.2

dependencies:
    cupertino_icons: ^1.0.8
    flutter:
        sdk: flutter
    flutter_dotenv: ^6.0.0
    flutter_secure_storage: ^9.2.4
    go_router: ^8.0.5
    http: ^1.5.0
    socket_io_client: ^3.1.2

dev_dependencies:
    build_runner: ^2.4.6
    flutter_test:
        sdk: flutter
    very_good_analysis: ^8.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
    uses-material-design: true
    assets:
        - lib/assets/backgrounds/mainbackground.gif
        - lib/assets/backgrounds/origbig.png
        - lib/assets/main-menu/SteamSteel.png
        - .env
    fonts:
        - family: 'Press Start 2P'
          fonts:
              - asset: fonts/PressStart2P-Regular.ttf

        # An image asset can refer to one or more resolution-specific "variants", see
        # https://flutter.dev/to/resolution-aware-images

        # For details regarding adding assets from package dependencies, see
        # https://flutter.dev/to/asset-from-package

        # For details regarding fonts from package dependencies,
        # see https://flutter.dev/to/font-from-package
