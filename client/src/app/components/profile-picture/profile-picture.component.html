<div class="profile-picture-container">
    <div class="avatar-list">
        <div
            *ngFor="let avatar of avatars"
            class="avatar-container"
            (click)="selectPredefinedAvatar(avatar.id)"
        >
            <img
                [src]="avatar.preview"
                [alt]="'Avatar ' + avatar.id"
                [class.selected]="isSelected(avatar.id)"
                [class.shop-avatar]="avatar.isShopAvatar && isShopAvatarOwned(avatar)"
                [class.shop-avatar-locked]="avatar.isShopAvatar && !isShopAvatarOwned(avatar)"
                [class.disabled]="!canSelectAvatar(avatar)"
                class="avatar-img"
            />
            <div *ngIf="avatar.isShopAvatar && !isShopAvatarOwned(avatar)" class="lock-overlay">
                <span class="lock-icon">🔒</span>
            </div>
        </div>
        <label class="avatar-upload-label">
            <input type="file" accept="image/*" (change)="onAvatarFileSelected($event)" hidden />
            <span class="avatar-upload-btn">+</span>
        </label>
        <img *ngIf="customAvatarPreview" [src]="customAvatarPreview" alt="Aperçu avatar personnalisé" class="avatar-img selected" />
    </div>
    <div *ngIf="customAvatarPreview" class="custom-avatar-reset">
        <button type="button" (click)="removeCustomAvatar()">Retirer l'image personnalisée</button>
    </div>
</div>
